services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: phpaml_data_test
      MYSQL_USER: phpaml
      MYSQL_PASSWORD: phpaml_test
      MYSQL_ROOT_PASSWORD: root_test
    ports: ["13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uphpaml -pphpaml_test --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 150s

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: phpaml_data_test
      MARIADB_USER: phpaml
      MARIADB_PASSWORD: phpaml_test
      MARIADB_ROOT_PASSWORD: root_test
    ports: ["33061:3306"]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: phpaml_data_test
      POSTGRES_USER: phpaml
      POSTGRES_PASSWORD: phpaml_test
    ports: ["54320:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phpaml -d phpaml_data_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  mongodb:
    image: mongo:8.2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' localhost:27017/test | grep 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  mongodb-init:
    image: mongo:8.2
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongodb:27017", "--eval", "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})"]
